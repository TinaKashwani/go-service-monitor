name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l -- cmd internal)"
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Test
        run: go test ./cmd/... ./internal/...
      - name: Test with race detector
        run: go test -race ./cmd/... ./internal/...
      - name: Build
        run: go build -buildvcs=false ./cmd/server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --browsers=ChromeHeadless
      - name: Production build
        run: npm run build -- --configuration production

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mocked browser tests
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start full stack
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Smoke test frontend and proxied API
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:4200/frontend-health
          curl --fail --retry 5 --retry-delay 2 http://localhost:4200/
          response="$(curl --fail --retry 5 --retry-delay 2 http://localhost:4200/api/v1/services/status)"
          echo "$response" | grep --fixed-strings '"name":"Backend"'
          echo "$response" | grep --fixed-strings '"status":"up"'
      - name: Capture Compose logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-failure-logs
          path: compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop full stack
        if: always()
        run: docker compose down --volumes --remove-orphans
