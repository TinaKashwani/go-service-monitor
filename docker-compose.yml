name: go-service-monitor

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ENABLE_AD_HOC_CHECKS: "false"
      MONITORED_SERVICES: '[{"name":"Backend","url":"http://backend:8080/health"},{"name":"Unavailable","url":"http://127.0.0.1:59999/health"}]'
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    init: true
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/frontend-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    init: true
    restart: "no"
